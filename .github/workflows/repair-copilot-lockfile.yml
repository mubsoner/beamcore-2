name: Repair Copilot branch lockfile

on:
  push:
    branches:
      - copilot/repair-build-preview-20261109

permissions:
  contents: write

concurrency:
  group: repair-copilot-lockfile
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate lockfile with the pinned pnpm version
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit the regenerated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "pnpm-lock.yaml is already synchronized."
          fi

      - name: Verify frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build
